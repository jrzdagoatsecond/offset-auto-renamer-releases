name: Build Windows executables

# Builds run on GitHub's hosted windows-latest runner, since PyInstaller
# packages for whatever OS it runs on and a real .exe needs a Windows build.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5 pyinstaller

      - name: Build Offset Auto Renamer
        run: pyinstaller OffsetAutoRenamer.spec

      - name: Build Offset Key Generator
        run: pyinstaller OffsetKeyGenerator.spec

      - name: Upload Offset Auto Renamer.exe
        uses: actions/upload-artifact@v4
        with:
          name: OffsetAutoRenamer
          path: dist/OffsetAutoRenamer.exe
          retention-days: 5

      - name: Upload Offset Key Generator.exe
        uses: actions/upload-artifact@v4
        with:
          name: OffsetKeyGenerator
          path: dist/OffsetKeyGenerator.exe
          retention-days: 5

  # Publishes a Release containing the built .exe to the SEPARATE, PUBLIC
  # releases-only repo -- never to this private source repo. This is what
  # the app's silent auto-updater (updater.py) checks and downloads from.
  # Triggered only by pushing a version tag, e.g.:
  #   git tag v1.1.0
  #   git push origin v1.1.0
  release:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5 pyinstaller

      - name: Build Offset Auto Renamer
        run: pyinstaller OffsetAutoRenamer.spec

      - name: Build Offset Key Generator
        run: pyinstaller OffsetKeyGenerator.spec

      - name: Publish release to the public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: jrzdagoatsecond/offset-auto-renamer-releases
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/OffsetAutoRenamer.exe
            dist/OffsetKeyGenerator.exe
